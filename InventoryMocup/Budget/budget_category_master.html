<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eConnect | Budget Category Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div id="sidebar-placeholder"></div>
    <div id="header-placeholder"></div>
    <main id="main-wrapper">
        <div class="sticky-header px-3 py-2 mb-2">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">Budget Category Master</h5>
                <button class="btn btn-premium px-4" onclick="openCat()"><i class="bi bi-plus-lg me-2"></i>Add Category</button>
            </div>
        </div>

        <div class="dcard mb-2">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label small fw-bold text-muted">Search</label>
                    <input type="text" id="cSearch" class="form-control" placeholder="Code or Category name..." oninput="render()">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Budget Type</label>
                    <select id="cType" class="form-select" onchange="render()">
                        <option value="">All Types</option>
                        <option value="CAPEX">CAPEX (Capital)</option>
                        <option value="OPEX">OPEX (Revenue)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Status</label>
                    <select id="cStatus" class="form-select" onchange="render()">
                        <option value="">All</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-hover mb-0">
                <thead class="bg-light">
                    <tr><th class="ps-4">Category Code</th><th>Category Name</th><th>Budget Type</th><th>Status</th></tr>
                </thead>
                <tbody id="catBody"></tbody>
            </table>
            <div class="p-3 border-top small text-muted" id="catCount"></div>
        </div>
    </main>

    <div class="modal fade" id="catModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header p-3"><h5 class="modal-title fw-bold" id="catTitle">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label fw-bold">Budget Type <span class="text-danger">*</span></label>
                        <select id="mType" class="form-select"><option value="CAPEX">CAPEX (Capital)</option><option value="OPEX">OPEX (Revenue)</option></select></div>
                    <div class="mb-3"><label class="form-label fw-bold">Category Code <span class="text-danger">*</span></label>
                        <input id="mCode" class="form-control text-uppercase" maxlength="10" placeholder="e.g. CPX-ITH"></div>
                    <div class="mb-3"><label class="form-label fw-bold">Category Name <span class="text-danger">*</span></label>
                        <input id="mName" class="form-control" maxlength="60"></div>
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="mActive" checked>
                        <label class="form-check-label" for="mActive">Active (available in Budget Entry)</label></div>
                </div>
                <div class="modal-footer p-3">
                    <button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-premium px-4" onclick="saveCat()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../sidebar.js"></script>
    <script src="../header.js"></script>
    <script src="budget_category_master.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        let editing = null;

        function render() {
            const q = $('cSearch').value.trim().toLowerCase(), t = $('cType').value, s = $('cStatus').value;
            const rows = BUDGET_CATEGORY_MASTER.filter((c) =>
                (!q || (c.code + ' ' + c.name).toLowerCase().includes(q)) &&
                (!t || c.type === t) && (s === '' || String(+c.active) === s));
            $('catBody').innerHTML = rows.map((c) => `
                <tr>
                    <td class="fw-bold text-nowrap">
                        <div class="dropdown d-inline-block">
                            <button class="btn btn-sm btn-light" data-bs-toggle="dropdown"><i class="bi bi-three-dots-vertical"></i></button>
                            <ul class="dropdown-menu shadow-sm">
                                <li><a class="dropdown-item" href="#" onclick="openCat('${c.code}');return false;"><i class="bi bi-pencil-square me-2 text-secondary"></i>Edit</a></li>
                                <li><a class="dropdown-item" href="#" onclick="toggleCat('${c.code}');return false;">
                                    <i class="bi ${c.active ? 'bi-x-circle text-danger' : 'bi-check-circle text-success'} me-2"></i>${c.active ? 'Deactivate' : 'Activate'}</a></li>
                            </ul>
                        </div>
                        <span class="ms-2">${c.code}</span>
                    </td>
                    <td>${c.name}</td>
                    <td><span class="status-pill bg-${c.type.toLowerCase()}">${c.type}</span></td>
                    <td><span class="status ${c.active ? 'approved' : 'rejected'}">${c.active ? 'Active' : 'Inactive'}</span></td>
                </tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">No categories found.</td></tr>';
            $('catCount').textContent = `${rows.length} of ${BUDGET_CATEGORY_MASTER.length} categories`;
        }

        function openCat(code) {
            editing = code ? getBudgetCategory(code) : null;
            $('catTitle').textContent = editing ? 'Edit Category' : 'Add Category';
            $('mType').value = editing ? editing.type : 'CAPEX';
            $('mCode').value = editing ? editing.code : '';
            $('mCode').disabled = !!editing;
            $('mName').value = editing ? editing.name : '';
            $('mActive').checked = editing ? editing.active : true;
            bootstrap.Modal.getOrCreateInstance($('catModal')).show();
        }

        function saveCat() {
            const code = $('mCode').value.trim().toUpperCase(), name = $('mName').value.trim();
            if (!code || !name) { alert('Code and Name are required.'); return; }
            if (!editing && getBudgetCategory(code)) { alert('Category code already exists.'); return; }
            if (editing) Object.assign(editing, { type: $('mType').value, name, active: $('mActive').checked });
            else BUDGET_CATEGORY_MASTER.push({ code, name, type: $('mType').value, active: $('mActive').checked });
            bootstrap.Modal.getInstance($('catModal')).hide();
            render();
        }

        function toggleCat(code) { const c = getBudgetCategory(code); c.active = !c.active; render(); }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>

</html>
